name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: |
          if npx jest --version > /dev/null 2>&1; then
            npx jest --config jest/config.js --passWithNoTests
          else
            echo "Jest is not installed yet, skipping tests cleanly."
          fi

