# One-time helper: installs the file picker library and commits package.json + package-lock.json.
# Run it from the GitHub app/website: Actions -> "Add document picker dependency" -> Run workflow.
# (CI uses `npm ci`, which needs package.json and package-lock.json to match, so this cannot be
# done by editing package.json by hand.)
name: Add document picker dependency

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Add expo-document-picker (version chosen for this Expo SDK)
        run: npx expo install expo-document-picker

      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "expo-document-picker is already installed. Nothing to commit."
          else
            git commit -m "Add expo-document-picker"
            git push
          fi
